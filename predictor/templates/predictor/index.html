<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
            --primary-btn: #007bff;
            --primary-btn-hover: #0056b3;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #f4f4f9;
            --border-color: #444444;
            --primary-btn: #bb86fc;
            --primary-btn-hover: #9b59b6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            position: relative;
            transition: background-color 0.3s;
        }

        .theme-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: transparent;
            color: var(--text-color);
            box-sizing: border-box;
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-btn);
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            background-color: var(--primary-btn-hover);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(0, 123, 255, 0.1);
            border-left: 4px solid var(--primary-btn);
            border-radius: 4px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="theme-switch" onclick="toggleTheme()">🌓</button>
        <h2>Price Predictor</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Overall Quality (1-10)</label>
                <input type="number" name="overall_qual" required min="1" max="10" value="5">
            </div>
            <div class="form-group">
                <label>Living Area (sq ft)</label>
                <input type="number" name="gr_liv_area" required value="1500">
            </div>
            <div class="form-group">
                <label>Garage Capacity (Cars)</label>
                <input type="number" name="garage_cars" required value="2">
            </div>
            <div class="form-group">
                <label>Basement Area (sq ft)</label>
                <input type="number" name="total_bsmt_sf" required value="1000">
            </div>
            <div class="form-group">
                <label>Full Bathrooms</label>
                <input type="number" name="full_bath" required value="2">
            </div>
            <button type="submit" class="submit-btn">Predict Price</button>
        </form>

        {% if prediction %}
        <div class="result">
            Estimated Price: {{ prediction }}
        </div>
        {% endif %}
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Apply saved theme on load
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
